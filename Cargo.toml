[workspace]
members = [
  ".",
  "crates/seagrass",
  "crates/seagrass-framework",
  "crates/seagrass-sources",
  "crates/seagrass-anchor-v1",
  "crates/seagrass-anchor-v2-preview",
  "crates/seagrass-native",
  "crates/seagrass-pinocchio",
  "fuzz",
  "editors/zed",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
authors = ["Seagrass Maintainers <17379963+heyAyushh@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/heyAyushh/seagrass"

[workspace.dependencies]
anchor-syn = { version = "1.0.2", git = "https://github.com/otter-sec/anchor.git", rev = "4addac5304bf2d2378448e86b5ee374c99037585", features = ["init-if-needed"] }
cargo_toml = "0.22.3"
proptest = "1"
# Pinned to the exact version so the parity tests in src/solana/runtime_catalog.rs
# compile against the same sysvar IDs and struct layouts that the catalog documents.
# Bump this only when you intend to audit the catalog against the new release.
solana-program = "=2.2.1"
syn = "2"

[package]
name = "seagrass"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Language server for Solana framework programs"
readme = "README.md"
publish = true
homepage = "https://github.com/heyAyushh/seagrass"
documentation = "https://docs.rs/seagrass"
keywords = ["solana", "anchor", "lsp", "language-server", "lint"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "seagrass"
doctest = false

[features]
default = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
anchor-syn = { workspace = true }
cargo_toml = { workspace = true }
solana-program = { workspace = true }
seagrass-framework = { path = "crates/seagrass-framework", version = "0.1.2" }
seagrass-native = { path = "crates/seagrass-native", version = "0.1.2" }
seagrass-pinocchio = { path = "crates/seagrass-pinocchio", version = "0.1.2" }
syn = { workspace = true, features = ["full", "extra-traits", "parsing", "visit"] }
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6"
hotpath = { version = "0.16.1", optional = true }
proc-macro2 = { version = "1.0.100", features = ["span-locations"] }
quote = "1"
salsa = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
toml = "0.7.6"
toml_edit = { version = "0.25.12", default-features = false, features = ["parse"] }
tower = "0.4"
tower-lsp = "0.20"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
wait-timeout = "0.2"

[dev-dependencies]
proptest = { workspace = true }
solana-clock = "2.2.3"
solana-rent = "2.2.1"

[profile.release]
lto = true
