[workspace]
members = [
  ".",
  "crates/seagrass",
  "crates/seagrass-framework",
  "crates/seagrass-sources",
  "crates/seagrass-anchor-v1",
  "crates/seagrass-anchor-v2-preview",
  "crates/seagrass-native",
  "crates/seagrass-pinocchio",
  "fuzz",
  "editors/zed",
]
resolver = "2"

[workspace.package]
version = "1.0.2"
authors = ["Seagrass Maintainers <17379963+heyAyushh@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/heyAyushh/seagrass"

[workspace.dependencies]
anchor-syn = { version = "1.0.2", git = "https://github.com/otter-sec/anchor.git", rev = "4addac53" }
cargo_toml = "0.22.3"
proptest = "1"
syn = "2"

[package]
name = "seagrass"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language server for Solana framework programs"
readme = "README.md"
default-run = "seagrass"
publish = true
homepage = "https://github.com/heyAyushh/seagrass"
documentation = "https://docs.rs/seagrass"
keywords = ["solana", "anchor", "lsp", "language-server", "lint"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "seagrass"
doctest = false

[[bin]]
name = "seagrass"
path = "src/main.rs"

[features]
default = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
anchor-syn = { workspace = true }
cargo_toml = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "parsing", "visit"] }
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6"
hotpath = { version = "0.16.1", optional = true }
proc-macro2 = { version = "1.0.100", features = ["span-locations"] }
quote = "1"
salsa = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
toml = "0.7.6"
tower-lsp = "0.20"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
proptest = { workspace = true }

[profile.release]
lto = true
