[package]
name = "seagrass"
version.workspace = true
publish = false
authors = ["Seagrass Maintainers <17379963+heyAyushh@users.noreply.github.com>"]
repository = "https://github.com/heyAyushh/seagrass"
license = "MIT"
description = "Language server for Solana framework programs"
readme = "README.md"
edition = "2021"
default-run = "seagrass"

[lib]
name = "seagrass"
doctest = false

[[bin]]
name = "seagrass"
path = "src/main.rs"

[features]
default = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
anchor-syn = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6"
hotpath = { version = "0.16.1", optional = true }
proc-macro2 = { version = "1.0.100", features = ["span-locations"] }
quote = "1"
salsa = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
cargo_toml = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "parsing", "visit"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
toml = "0.7.6"
tower-lsp = "0.20"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
proptest = { workspace = true }
