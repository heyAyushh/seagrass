# External corpus manifest — committed; source trees are NOT committed.
#
# Each entry pins a real Apache-2.0 or MIT Anchor program at an exact commit
# SHA.  The fetch script (scripts/fetch-corpus.sh) materialises the source
# trees into corpus/programs/<name>/, which is gitignored.
#
# Fields
# ------
# name    – unique slug used as the directory name under corpus/programs/
# repo    – HTTPS clone URL
# sha     – exact commit SHA (resolve with: git ls-remote <repo> HEAD)
# subpath – (optional) sparse path to clone; omit to clone the whole repo
# license – SPDX identifier of the upstream licence

[[program]]
name    = "spl-token"
repo    = "https://github.com/solana-labs/solana-program-library"
sha     = "264ca72de06b0c2b45c0b15d298000fe3f82db2e"
subpath = "token/program"
license = "Apache-2.0"

