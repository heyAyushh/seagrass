id = "seagrass"
name = "Seagrass"
description = "Anchor-specific diagnostics, completions, hovers, symbols, and fixes plus local artifact evidence for Anchor, Pinocchio, and native Solana Rust programs."
version = "1.0.2"
schema_version = 1
authors = ["Seagrass Maintainers <17379963+heyAyushh@users.noreply.github.com>"]
repository = "https://github.com/heyAyushh/seagrass"

[language_servers.seagrass]
name = "Seagrass"
languages = ["Rust"]
language_ids = { Rust = "rust" }
code_action_kinds = ["quickfix", "source"]

[slash_commands.seagrass-status]
description = "Show Seagrass server status"
requires_argument = false

[slash_commands.seagrass-coverage]
description = "Show Seagrass project coverage"
requires_argument = false

[slash_commands.seagrass-artifacts]
description = "Show Seagrass artifact report"
requires_argument = false

[slash_commands.seagrass-feedback]
description = "Show Seagrass feedback URL"
requires_argument = false
