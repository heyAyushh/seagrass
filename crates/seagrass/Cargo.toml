[package]
name = "seagrass-cli"
version.workspace = true
publish = false
authors = ["Seagrass Maintainers <17379963+heyAyushh@users.noreply.github.com>"]
repository = "https://github.com/heyAyushh/seagrass"
license = "MIT"
description = "Installable Seagrass language-server entrypoint"
edition = "2021"

[[bin]]
name = "seagrass"
path = "src/main.rs"

[dependencies]
seagrass-core = { package = "seagrass", path = "../../lsp" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
