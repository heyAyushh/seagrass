[package]
name = "seagrass-framework"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Framework and source traits for Seagrass integrations"
homepage = "https://github.com/heyAyushh/seagrass"
keywords = ["solana", "anchor", "lsp"]
categories = ["development-tools"]

[dependencies]
proc-macro2 = { version = "1.0.100", features = ["span-locations"] }
quote = "1"
serde_json = "1"
syn = { workspace = true, features = ["full", "extra-traits", "parsing", "visit"] }
tower-lsp = "0.20"
