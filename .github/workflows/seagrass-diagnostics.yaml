name: Seagrass diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.rs"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Seagrass.toml"
      - "src/**"
      - "programs/**"
      - "fixtures/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install smoke dependencies
        run: cargo build -p seagrass-cli
      - name: Golden-path smoke
        run: bash scripts/smoke-install.sh

  sarif:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build seagrass
        run: cargo build -p seagrass-cli --release
      - name: Run SARIF diagnostics on smoke fixture
        run: |
          ./target/release/seagrass diagnostics fixtures/smoke-broken.rs --sarif > seagrass.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: seagrass.sarif
          category: seagrass