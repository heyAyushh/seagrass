name: Anchor Property Tests

on:
  pull_request:
    branches:
      - master
      - anchor-next
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "idl/**"
      - "lang/**"
      - "lsp/**"
      - "lsp/scripts/verify-proptest.ts"
      - ".github/workflows/lsp-property-tests.yaml"
  push:
    branches:
      - master
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "idl/**"
      - "lang/**"
      - "lsp/**"
      - "lsp/scripts/verify-proptest.ts"
      - ".github/workflows/lsp-property-tests.yaml"
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.8"
  NODE_VERSION: "24"
  PROPTEST_CASES: "10000"

jobs:
  property-tests:
    name: Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ""
      - name: Install Bun
        run: |
          npm install --global "bun@${BUN_VERSION}"
          bun --version
      - name: Run Anchor property tests
        run: bun lsp/scripts/verify-proptest.ts
