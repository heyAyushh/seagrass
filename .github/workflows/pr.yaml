name: Seagrass PR Guardrails

on:
  pull_request:
    branches:
      - main
      - anchor-next
    paths:
      - "**"
      - "VERSION"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "bump-version.sh"
      - ".github/workflows/fuzz.yaml"
      - ".github/workflows/install-smoke.yaml"
      - ".github/workflows/perf.yaml"
      - ".github/workflows/pr.yaml"
      - ".github/workflows/property-tests.yaml"
      - ".github/workflows/release-plz.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/seagrass-diagnostics.yaml"
      - "release-plz.toml"
      - "docs/topics.json"
      - "docs/topics.schema.json"
      - "docs/release-readiness.json"
      - "scripts/check-diagnostic-topics.ts"
      - "scripts/check-generated-support.ts"
      - "scripts/check-generated-support.test.ts"
      - "scripts/check-lint-catalog.ts"
      - "scripts/check-recognized-settings.ts"
      - "scripts/check-release-parity.ts"
      - "scripts/check-release-parity.test.ts"
      - "scripts/check-release-readiness.ts"
      - "scripts/check-seagrass-toml-contract.ts"
      - "scripts/smoke-release-install.ts"
      - "scripts/generated-support.lock.json"
      - "scripts/package-release.ts"
  push:
    branches:
      - main
    paths:
      - "**"
      - "VERSION"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "bump-version.sh"
      - ".github/workflows/fuzz.yaml"
      - ".github/workflows/install-smoke.yaml"
      - ".github/workflows/perf.yaml"
      - ".github/workflows/pr.yaml"
      - ".github/workflows/property-tests.yaml"
      - ".github/workflows/release-plz.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/seagrass-diagnostics.yaml"
      - "release-plz.toml"
      - "docs/topics.json"
      - "docs/topics.schema.json"
      - "docs/release-readiness.json"
      - "scripts/check-diagnostic-topics.ts"
      - "scripts/check-generated-support.ts"
      - "scripts/check-generated-support.test.ts"
      - "scripts/check-lint-catalog.ts"
      - "scripts/check-recognized-settings.ts"
      - "scripts/check-release-parity.ts"
      - "scripts/check-release-parity.test.ts"
      - "scripts/check-release-readiness.ts"
      - "scripts/check-seagrass-toml-contract.ts"
      - "scripts/smoke-release-install.ts"
      - "scripts/generated-support.lock.json"
      - "scripts/package-release.ts"
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.8"
  NODE_VERSION: "24"
  PROPTEST_CASES: "10000"

jobs:
  source-guardrails:
    name: Source guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ""
      - name: Install Bun
        run: node scripts/install-bun-ci.mjs
      - name: Check source size
        run: bun scripts/check-source-size.ts
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check diagnostic rule hygiene
        run: bun scripts/check-rule-hygiene.ts
      - name: Test diagnostic rule hygiene checker
        run: bun test scripts/check-rule-hygiene.test.ts
      - name: Check diagnostic topic manifest
        run: bun scripts/check-diagnostic-topics.ts
      - name: Test diagnostic topic checker
        run: bun test scripts/check-diagnostic-topics.test.ts
      - name: Check diagnostic audit
        run: bun scripts/check-diagnostic-audit.ts
      - name: Test diagnostic audit checker
        run: bun test scripts/check-diagnostic-audit.test.ts
      - name: Check research citations
        run: bun scripts/check-research-citations.ts
      - name: Test research citation checker
        run: bun test scripts/check-research-citations.test.ts
      - name: Check lint catalog
        run: bun scripts/check-lint-catalog.ts
      - name: Test lint catalog checker
        run: bun test scripts/check-lint-catalog.test.ts
      - name: Check recognized settings manifest
        run: bun scripts/check-recognized-settings.ts
      - name: Check Seagrass.toml contract
        run: bun scripts/check-seagrass-toml-contract.ts
      - name: Check release install parity
        run: bun scripts/check-release-parity.ts
      - name: Test release install parity checker
        run: bun test scripts/check-release-parity.test.ts
      - name: Check generated Anchor support integrity
        run: bun scripts/check-generated-support.ts
      - name: Test generated Anchor support checker
        run: bun test scripts/check-generated-support.test.ts
      - name: Check release readiness evidence shape
        run: bun scripts/check-release-readiness.ts --allow-pending --version "$(tr -d '[:space:]' < VERSION)"
      - name: Test release readiness checker
        run: bun test scripts/check-release-readiness.test.ts
      - name: Test fuzz readiness evidence
        run: bun test scripts/fuzz-readiness.test.ts
      - name: Test fuzz artifact import
        run: bun test scripts/import-fuzz-artifacts.test.ts
      - name: Test external review readiness evidence
        run: bun test scripts/review-readiness.test.ts
      - name: Test release readiness apply
        run: bun test scripts/apply-release-readiness.test.ts
      - name: Test release workflow packaging
        run: bun test scripts/release-workflow.test.ts
      - name: Test release package command
        run: bun test scripts/package-release.test.ts
      - name: Test perf workflow guardrails
        run: bun test scripts/perf-workflow.test.ts
      - name: Run editor UX parity tests
        run: cargo test -p seagrass editor_ux_parity -- --nocapture
      - name: Run seagrass unit tests
        run: cargo test -p seagrass
      - name: Run protocol smoke
        run: bun scripts/protocol-smoke.ts

  server-portability:
    name: Server portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
      - name: Build language server binary
        run: cargo build -p seagrass-cli --locked
      - name: Run framework crate tests
        run: >
          cargo test --locked
          -p seagrass-framework
          -p seagrass-anchor-v1
          -p seagrass-anchor-v2-preview
          -p seagrass-pinocchio
          -p seagrass-native
          -p seagrass-sources
      - name: Run seagrass library tests
        run: cargo test -p seagrass --locked
