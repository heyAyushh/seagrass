name: Seagrass External Corpus

on:
  schedule:
    # Nightly at 02:17 UTC — offset from the top of the hour to spread load.
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "corpus/manifest.toml"

jobs:
  external-corpus:
    name: External corpus (discovery)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache fetched corpus programs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: corpus/programs
          key: corpus-${{ hashFiles('corpus/manifest.toml') }}
          # No restore-keys: an exact manifest hash match is required to avoid
          # using a stale cache that was pinned to a different set of SHAs.

      - name: Fetch external corpus programs
        run: bash scripts/fetch-corpus.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529bca0028893a2d9 # v1
        with:
          # Match the MSRV declared in the workspace Cargo.toml.
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1

      - name: Run external corpus test (discovery mode)
        # cargo check tier — no anchor build required.
        run: CORPUS_ENABLED=1 cargo test -p seagrass external_corpus -- --nocapture
